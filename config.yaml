# Настройки «Помощника валидации проверок». Этот файл обновление не трогает.

update:
  # Откуда скачиваются обновления (схема как в Toolbox ARM). Git не нужен:
  # всё идёт через REST API Bitbucket, логин и пароль — от учётной записи Omega.
  # Пример:
  #   repo_url: https://df-bitbucket.ca.sbrf.ru/scm/<проект>/<репозиторий>.git
  repo_url: NaN            # NaN — обновления выключены
  ref: main                # ветка или тег. NaN — ветка по умолчанию
  check_on_start: true     # проверять при открытии страницы
  # Эти файлы обновление не трогает, если они уже есть (настройки этого ПК).
  # Папки data, venv, tmp и .git не трогаются никогда.
  keep: [config.yaml]

network:
  # Проверка SSL-сертификатов. false — корпоративный сертификат часто не входит
  # в набор Python. Можно указать путь к файлу корневого сертификата (.pem / .crt).
  ssl_verify: false
  timeout_s: 60
